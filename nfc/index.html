<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NFC Tokens — Buy Direct</title>
  <style>
    :root{--bg:#0f1724;--card:#111827;--accent:#06b6d4;--muted:#9ca3af}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}
    body{background:linear-gradient(180deg,var(--bg),#051025);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
    .container{max-width:520px;width:100%}
    .card{background:rgba(255,255,255,0.03);padding:28px;border-radius:12px;box-shadow:0 6px 24px rgba(2,6,23,0.6)}
    h1{margin:0 0 8px;font-size:20px}
    p{color:var(--muted);margin:0 0 20px;font-size:15px}
    .links{display:grid;gap:12px}
    a.btn{display:block;text-decoration:none;background:linear-gradient(90deg,var(--accent),#7c3aed);color:#061226;padding:14px;border-radius:10px;font-weight:600;text-align:center}
    a.ghost{background:transparent;border:1px solid rgba(255,255,255,0.08);color:#e6eef8}
    footer{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}
    @media (max-width:420px){body{padding:16px}.card{padding:20px}}  
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Buy NFC tokens direct</h1>
      <p>I'm not going to middle-man NFC tokens, buy from the source and save some money.</p>
      <div class="links">
        <a class="btn" href="https://app.temu.com/m/qujlaebz0wk" target="_blank" rel="noopener noreferrer">Buy on Temu</a>
        <a class="btn ghost" href="https://s.click.aliexpress.com/e/_c3A8vW3z" target="_blank" rel="noopener noreferrer">Buy on AliExpress</a>
      </div>
      <footer>Links open in a new tab. These are the NFC tokens I ordered but you can use whatever NFC token you want. I might make money if you click through these links.</footer>
    </div>
  </div>
</body>
</html>
